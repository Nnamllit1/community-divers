name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build launcher and run native checks
        shell: cmd
        run: Build.cmd
      - name: Package versioned portable ZIP
        run: cpack --config out/windows-dev/CPackConfig.cmake -B dist
      - name: Build and verify per-user setup
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          ./tools/build-setup.ps1 -PortableZip $zip.FullName -OutputDirectory dist-setup-test -TestIdentity
          $qa = Get-ChildItem dist-setup-test -Filter '*.exe' | Select-Object -First 1
          python tests/setup_smoke.py --installer $qa.FullName --work "$env:RUNNER_TEMP/community-divers-setup-smoke" --registry-key CommunityDivers-QA --display-name "Community Divers QA"
          if ($LASTEXITCODE -ne 0) { throw 'Installer/uninstaller smoke test failed.' }
          python tests/setup_native_smoke.py --installer $qa.FullName --work "$env:RUNNER_TEMP/community-divers-native-setup"
          if ($LASTEXITCODE -ne 0) { throw 'Native setup capture, payload integrity or handoff check failed.' }
          ./tools/build-setup.ps1 -PortableZip $zip.FullName -OutputDirectory dist-setup-interruption -TestIdentity -TestInterrupt
          $interrupted = Get-ChildItem dist-setup-interruption -Filter '*.exe' | Select-Object -First 1
          python tests/setup_repair_smoke.py --installer $qa.FullName --interrupted-installer $interrupted.FullName --work "$env:RUNNER_TEMP/community-divers-setup-repair"
          if ($LASTEXITCODE -ne 0) { throw 'Interrupted setup repair check failed.' }
          ./tools/build-setup.ps1 -PortableZip $zip.FullName -OutputDirectory dist
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDivers-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.exe
      - name: Install separate service artifact
        run: cmake --install out/windows-dev --prefix dist-service --component Server
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDiversService-windows-x64
          path: dist-service/
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cmake --preset linux-dev
      - run: cmake --build --preset linux-dev
      - run: ctest --preset linux-dev
      - run: cmake --install out/linux-dev --prefix dist-service --component Server
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDiversService-linux-x64
          path: dist-service/

  hellforge-loader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/tools/hellforge-loader
          key: ${{ runner.os }}-hellforge-tools-${{ hashFiles('integrations/hellforge-loader/upstream.lock.json') }}
      - name: Build GPL loader and run synthetic fixtures
        shell: powershell
        run: ./integrations/hellforge-loader/Build.ps1

  publish-preview:
    needs: [windows, linux-core, hellforge-loader]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: CommunityDivers-windows-x64
          path: dist-ci
      - name: Publish immutable preview and promote signed feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CD_UPDATE_SIGNING_KEY: ${{ secrets.CD_UPDATE_SIGNING_KEY }}
          CD_BEFORE_SHA: ${{ github.event.before }}
        run: ./tools/publish-preview.ps1
