name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build launcher and run native checks
        shell: cmd
        run: Build.cmd
      - name: Package versioned portable ZIP
        run: cpack --config out/windows-dev/CPackConfig.cmake -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDivers-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Install separate service artifact
        run: cmake --install out/windows-dev --prefix dist-service --component Server
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDiversService-windows-x64
          path: dist-service/
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cmake --preset linux-dev
      - run: cmake --build --preset linux-dev
      - run: ctest --preset linux-dev
      - run: cmake --install out/linux-dev --prefix dist-service --component Server
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDiversService-linux-x64
          path: dist-service/

  publish-preview:
    needs: [windows, linux-core]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: preview-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: CommunityDivers-windows-x64
          path: dist-ci
      - name: Publish immutable preview and promote signed feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CD_UPDATE_SIGNING_KEY: ${{ secrets.CD_UPDATE_SIGNING_KEY }}
          CD_BEFORE_SHA: ${{ github.event.before }}
        run: ./tools/publish-preview.ps1
