name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher and run native checks
        shell: cmd
        run: Build.cmd
      - name: Package versioned portable ZIP
        run: cpack --config out/windows-dev/CPackConfig.cmake -B dist
      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDivers-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
  linux-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset linux-dev
      - run: cmake --build --preset linux-dev
      - run: ctest --preset linux-dev
